services:
  openclaw:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file: .env
    environment:
      # Mirrors the DATABASE_URL that Railway injects when its Postgres plugin is attached.
      # Override in .env if you need a different local connection string.
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gbrain
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persistent data survives container restarts (like Railway volumes)
      - openclaw-data:/data

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gbrain
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gbrain"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

volumes:
  openclaw-data:
  postgres-data:
